<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI Fashion Generator — Piyush Ramteke</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #080808;
      color: #e5e5e5;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 36px; }
    header h1 {
      font-size: 28px; font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    header p { font-size: 13px; color: #555; }
    header .badge {
      display: inline-block; margin-top: 8px;
      font-size: 10px; font-weight: 600; letter-spacing: .04em;
      background: #1a1a2e; border: 1px solid #3730a3;
      color: #818cf8; padding: 3px 10px; border-radius: 20px;
    }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 560px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 28px;
    }

    /* ── Form ── */
    label { display: block; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .06em;
            color: #555; margin-bottom: 8px; }
    textarea {
      width: 100%; height: 100px;
      background: #080808; border: 1px solid #2a2a2a;
      border-radius: 12px; color: #ddd; font-size: 13px;
      line-height: 1.6; padding: 12px 14px; resize: none;
      outline: none; transition: border-color .2s;
      font-family: inherit;
    }
    textarea:focus { border-color: #4f46e5; }
    textarea::placeholder { color: #333; }

    /* ── Quick prompts ── */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
    .chip {
      font-size: 11px; padding: 4px 10px;
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 20px; color: #666; cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { border-color: #4f46e5; color: #a78bfa; }

    /* ── Generate button ── */
    button.generate {
      width: 100%; padding: 13px;
      background: #4f46e5; border: none; border-radius: 12px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .2s; letter-spacing: .02em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button.generate:hover:not(:disabled) { background: #4338ca; }
    button.generate:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Result area ── */
    .result {
      margin-top: 28px;
      background: #080808; border: 1px solid #1a1a1a;
      border-radius: 16px; overflow: hidden;
      min-height: 360px; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .result img {
      width: 100%; display: block;
      border-radius: 16px;
    }
    .result .placeholder {
      text-align: center; padding: 40px 20px; color: #333;
    }
    .result .placeholder svg { margin: 0 auto 12px; display: block; }
    .result .placeholder p { font-size: 13px; }

    /* ── Spinner ── */
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #1f1f1f; border-top-color: #818cf8;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-wrap { text-align: center; }
    .loading-wrap p { margin-top: 14px; font-size: 13px; color: #555; }
    .loading-wrap .sub { font-size: 11px; color: #333; margin-top: 4px; }

    /* ── Status message ── */
    .status {
      margin-top: 12px; padding: 10px 14px;
      border-radius: 10px; font-size: 12px; font-weight: 500;
      display: none;
    }
    .status.error { background: #1a0a0a; border: 1px solid #7f1d1d; color: #f87171; display: block; }
    .status.ok    { background: #0a1a0a; border: 1px solid #14532d; color: #4ade80; display: block; }

    /* ── Download bar ── */
    .action-bar {
      display: none; margin-top: 14px;
      gap: 8px;
    }
    .action-bar.visible { display: flex; }
    .action-bar a, .action-bar button.regen {
      flex: 1; padding: 10px; border-radius: 10px;
      font-size: 12px; font-weight: 600; text-align: center;
      cursor: pointer; text-decoration: none; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .action-bar a {
      background: #0f0f0f; border: 1px solid #2a2a2a; color: #a78bfa;
    }
    .action-bar a:hover { border-color: #4f46e5; }
    .action-bar button.regen {
      background: #0f0f0f; border: 1px solid #2a2a2a; color: #555;
    }
    .action-bar button.regen:hover { border-color: #333; color: #ddd; }

    /* ── Footer ── */
    footer {
      margin-top: 40px; font-size: 11px; color: #333; text-align: center;
      border-top: 1px solid #161616; padding-top: 20px; width: 100%; max-width: 560px;
    }
    footer span { color: #4f46e5; }
  </style>
</head>
<body>

  <header>
    <h1>✦ AI Fashion Generator</h1>
    <p>Type a prompt → instant AI fashion image</p>
    <div class="badge">IBM Internship 2026 · Piyush Ramteke</div>
  </header>

  <div class="card">

    <label for="prompt">Describe your outfit</label>
    <textarea id="prompt" placeholder="e.g. A royal blue silk saree with gold zari border, studio fashion photography…"></textarea>

    <!-- Quick prompt chips -->
    <div class="chips" id="chips"></div>

    <button class="generate" id="btn" onclick="generate()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Generate Image
    </button>

    <!-- Result -->
    <div class="result" id="result">
      <div class="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2a2a2a" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>Your AI-generated fashion image will appear here</p>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status"></div>

    <!-- Actions -->
    <div class="action-bar" id="actions">
      <a id="dlLink" download="ai-fashion.jpg">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </a>
      <button class="regen" onclick="generate()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.98"/></svg>
        Regenerate
      </button>
    </div>

  </div>

  <footer>
    Powered by <span>Cloudflare Workers AI</span> (FLUX.1-schnell) ·
    Built by <span>Piyush Ramteke</span> · IBM Internship 2026
  </footer>

<script>
/* ── Config ── */
const BACKEND = '';  // same-origin on Vercel; set to full URL for local dev
const MODEL   = '@cf/black-forest-labs/flux-1-schnell';

/* ── Quick prompts ── */
const QUICK = [
  'Blue silk saree with gold border',
  'Teal blazer + grey jeans, smart casual',
  'White oversized hoodie streetwear',
  'Red bridal lehenga with embroidery',
  'Black crop top + maxi skirt, evening',
  'Vintage denim jacket, casual',
  'Beige linen kurta with block print',
  'Navy velvet blazer, formal Indian',
];

const chips = document.getElementById('chips');
QUICK.forEach(q => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = q;
  b.onclick = () => {
    document.getElementById('prompt').value = q;
    generate();
  };
  chips.appendChild(b);
});

/* ── State ── */
let busy = false;

/* ── Generate ── */
async function generate() {
  if (busy) return;
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) {
    showStatus('Please enter a prompt first.', 'error');
    return;
  }

  busy = true;
  clearStatus();
  hideActions();

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Generating…`;

  setResultLoading();

  try {
    const res = await fetch(`${BACKEND}/api/design`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, model: MODEL }),
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && data.success && data.image && data.image.startsWith('data:')) {
      setResultImage(data.image);
      showStatus('✓ Image generated successfully', 'ok');
      showActions(data.image);
    } else if (res.status === 429) {
      setResultEmpty();
      showStatus('Rate limit reached — please wait 1 minute and try again.', 'error');
    } else if (res.status === 503) {
      setResultEmpty();
      showStatus('Backend is starting up (cold start). Wait 30 seconds and try again.', 'error');
    } else {
      setResultEmpty();
      showStatus('Generation failed. The server may be busy — please retry.', 'error');
    }
  } catch (e) {
    setResultEmpty();
    showStatus('Cannot reach the server. Make sure you have internet access, then retry in 30 s.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Generate Image`;
  busy = false;
}

/* ── Result helpers ── */
function setResultLoading() {
  document.getElementById('result').innerHTML = `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <p>Generating your fashion design…</p>
      <p class="sub">Powered by Cloudflare FLUX.1</p>
    </div>`;
}
function setResultEmpty() {
  document.getElementById('result').innerHTML = `
    <div class="placeholder">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2a2a2a" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p>Generation failed — see message below</p>
    </div>`;
}
function setResultImage(src) {
  document.getElementById('result').innerHTML = `<img src="${src}" alt="Generated fashion design"/>`;
}

/* ── Status helpers ── */
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = `status ${type}`;
}
function clearStatus() {
  const el = document.getElementById('status');
  el.textContent = '';
  el.className = 'status';
}

/* ── Action helpers ── */
function showActions(imgSrc) {
  document.getElementById('dlLink').href = imgSrc;
  document.getElementById('actions').classList.add('visible');
}
function hideActions() {
  document.getElementById('actions').classList.remove('visible');
}

/* ── Enter key support ── */
document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generate();
});
</script>

</body>
</html>
