version: "3.9"

services:
  fashion-gpu:
    # Mount source code for live-reload during development
    volumes:
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./assets:/app/assets:ro
    environment:
      # Enable Streamlit auto-reload for development
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "watchdog"
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"

  fashion-cpu:
    volumes:
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./assets:/app/assets:ro
    environment:
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "watchdog"
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
