# ============================================================
#  docker-compose.yml
#  Piyu AI Clothing Fashion Design Generator
# ============================================================
#
#  Quick start:
#    1. cp .env.example .env  (then fill in HF_TOKEN)
#    2. docker compose up --build
#
#  GPU mode (requires nvidia-container-toolkit):
#    docker compose --profile gpu up --build
#
#  CPU-only mode:
#    docker compose --profile cpu up --build
# ============================================================

version: "3.9"

# ── Shared service definition ─────────────────────────────────────────────
x-fashion-base: &fashion-base
  image: piyu-fashion:latest
  build:
    context: .
    dockerfile: Dockerfile
    cache_from:
      - piyu-fashion:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # Override MODEL_DIR to use the mounted volume
    MODEL_DIR: /app/weights
    HF_HOME: /app/hf_cache
    TRANSFORMERS_CACHE: /app/hf_cache
    TORCH_HOME: /app/torch_cache
    STREAMLIT_SERVER_PORT: "8501"
    STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    STREAMLIT_SERVER_HEADLESS: "true"
    STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
    # Set to "cpu" to force CPU-only inference (slow but no GPU required)
    INFERENCE_DEVICE: "${INFERENCE_DEVICE:-cuda}"
  ports:
    - "${STREAMLIT_PORT:-8501}:8501"
  volumes:
    # Persist downloaded model weights across container restarts
    - model_weights:/app/weights
    # Persist Hugging Face model cache
    - hf_cache:/app/hf_cache
    # Persist generated results
    - ./results:/app/results
    # Persist reference images
    - ./reference_images:/app/reference_images
    # Mount samples read-only
    - ./samples:/app/samples:ro
    # Mount Streamlit secrets (create from .streamlit/secrets.toml.example)
    - ./.streamlit:/app/.streamlit:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 120s
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

# ── Services ──────────────────────────────────────────────────────────────
services:

  # ── GPU-accelerated service (default / recommended) ─────────────────────
  fashion-gpu:
    <<: *fashion-base
    container_name: piyu-fashion-gpu
    profiles:
      - gpu
      - default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MODEL_DIR: /app/weights
      HF_HOME: /app/hf_cache
      TRANSFORMERS_CACHE: /app/hf_cache
      TORCH_HOME: /app/torch_cache
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      INFERENCE_DEVICE: "cuda"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  # ── CPU-only service (no GPU required, slower inference) ─────────────────
  fashion-cpu:
    <<: *fashion-base
    container_name: piyu-fashion-cpu
    profiles:
      - cpu
    environment:
      MODEL_DIR: /app/weights
      HF_HOME: /app/hf_cache
      TRANSFORMERS_CACHE: /app/hf_cache
      TORCH_HOME: /app/torch_cache
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      INFERENCE_DEVICE: "cpu"
      CUDA_VISIBLE_DEVICES: ""

# ── Named volumes (persisted across restarts) ─────────────────────────────
volumes:
  model_weights:
    name: piyu_fashion_model_weights
    driver: local
  hf_cache:
    name: piyu_fashion_hf_cache
    driver: local
