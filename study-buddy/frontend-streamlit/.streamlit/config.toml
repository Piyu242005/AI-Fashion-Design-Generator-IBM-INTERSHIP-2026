# =============================================================================
# Streamlit Configuration — AI-Powered Study Buddy (Luxury Red & Dark Edition)
# Controls theme, server settings, and UI defaults
# =============================================================================

[theme]
primaryColor               = "#FF003C"       # Luxury Red Accent
backgroundColor            = "#050505"       # Deep Black Canvas
secondaryBackgroundColor   = "#111111"       # Sidebar & Card Background
textColor                  = "#FFFFFF"       # High-contrast Crisp Text
font                       = "sans serif"

[server]
headless                   = true
enableCORS                 = false
enableXsrfProtection       = true
maxUploadSize              = 50              # MB

[browser]
gatherUsageStats           = false

[runner]
fastReruns                 = true
