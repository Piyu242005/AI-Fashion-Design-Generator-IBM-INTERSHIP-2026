# Render deployment configuration for AI-Powered Study Buddy backend
# https://render.com/docs/yaml-spec

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────
  - type: web
    name: study-buddy-api
    runtime: python
    region: oregon
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1

    rootDir: backend

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false                      # Set in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false                      # Set in Render dashboard
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/study_buddy.db
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: '["https://study-buddy.streamlit.app"]'

    disk:
      name: study-buddy-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1                          # Free tier limit
