[theme]
primaryColor       = "#3b82f6"
backgroundColor    = "#0f1117"
secondaryBackgroundColor = "#1e2130"
textColor          = "#e2e8f0"
font               = "sans serif"

[server]
headless           = true
enableCORS         = false
enableXsrfProtection = true
maxUploadSize      = 50

[browser]
gatherUsageStats   = false

[runner]
fastReruns         = true
