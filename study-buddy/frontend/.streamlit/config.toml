# =============================================================================
# Streamlit Configuration — AI-Powered Study Buddy
# Controls theme, server settings, and UI defaults
# =============================================================================

[theme]
primaryColor       = "#3b82f6"       # Accent blue
backgroundColor    = "#0f1117"       # Dark background
secondaryBackgroundColor = "#1e2130" # Card / sidebar background
textColor          = "#e2e8f0"       # Primary text
font               = "sans serif"

[server]
headless           = true
enableCORS         = false
enableXsrfProtection = true
maxUploadSize      = 50             # MB

[browser]
gatherUsageStats   = false

[runner]
fastReruns         = true
