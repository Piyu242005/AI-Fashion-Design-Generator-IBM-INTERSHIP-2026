    tailwind.config = {
      theme: {
        extend: {
          animation: { 'spin-slow': 'spin 1.5s linear infinite' }

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #080808; }

    /* line-clamp — webkit prefix + standard property for full compatibility */
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      line-clamp: 1;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin  { animation: spin 1s linear infinite; }
    .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

    ::-webkit-scrollbar       { width: 4px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* Loading splash shown before React mounts */
    #loading-splash {
      position: fixed; inset: 0;
      background: #080808;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      z-index: 9999;
      transition: opacity .3s;
    }
    #loading-splash .ring {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #222;
      border-top-color: #a78bfa;
      animation: spin .8s linear infinite;
    }
    #loading-splash p { color: #525252; font-size: 13px; font-family: system-ui, sans-serif; margin: 0; }
  </style>
</head>
<body>
  <!-- Shown while CDN scripts + Babel compile; hidden once React mounts -->
  <div id="loading-splash">
    <div class="ring"></div>
    <p>Loading AI Fashion Studio…</p>
  </div>
  <div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ── Hide loading splash once React is ready ─────────────────────── */
function hideSplash() {
  const el = document.getElementById('loading-splash');
  if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
}

/* ── Lucide icon wrapper ─────────────────────────────────────────── */
// lucide UMD exposes every icon as a named export that is an array:
//   lucide.Sparkles = ["svg", { ...svgAttrs }, [ [childTag, childAttrs], ... ]]
// We convert that tree to JSX elements at render time — no DOM mutations,
// no useEffect, no race conditions, works on first paint.
function Icon({ name, size = 16, className = "" }) {
  if (!window.lucide) return <span style={{display:'inline-block',width:size,height:size}} />;

  // PascalCase the name to match lucide's export keys (e.g. "arrowRight" → "ArrowRight")
  const key = name.charAt(0).toUpperCase() + name.slice(1);
  const iconDef = window.lucide[key] || window.lucide['HelpCircle'];
  if (!iconDef || !Array.isArray(iconDef)) return <span style={{display:'inline-block',width:size,height:size}} />;

  // iconDef = ["svg", defaultAttrs, [ [tag, attrs], ... ]]
  const children = iconDef[2] || [];

  const renderChild = ([tag, attrs], i) => {
    // attrs may contain camelCase or kebab-case keys; React needs camelCase
    const fixed = {};
    for (const [k, v] of Object.entries(attrs || {})) {
      // convert stroke-width → strokeWidth, stroke-linecap → strokeLinecap etc.
      fixed[k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = v;
    }
    if (tag === 'path')     return <path key={i} {...fixed} />;
    if (tag === 'circle')   return <circle key={i} {...fixed} />;
    if (tag === 'line')     return <line key={i} {...fixed} />;
    if (tag === 'rect')     return <rect key={i} {...fixed} />;
    if (tag === 'polyline') return <polyline key={i} {...fixed} />;
    if (tag === 'polygon')  return <polygon key={i} {...fixed} />;
    if (tag === 'ellipse')  return <ellipse key={i} {...fixed} />;
    return null;
  };

  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth={2}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={`inline-block shrink-0 ${className}`}
      style={{ verticalAlign: 'middle' }}
    >
      {children.map(renderChild)}
    </svg>
  );
}

/* ── CONFIG ──────────────────────────────────────────────────────── */
const BACKEND_URL   = "http://localhost:8000";
// Gemini key (optional): paste your key here, or set it via a <meta> tag:
//   <meta name="gemini-key" content="AIza...">
const GEMINI_KEY    = (document.querySelector('meta[name="gemini-key"]')?.content) || "";
const GEMINI_MODEL  = "gemini-2.5-flash";
const FALLBACK_IMG  = "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&q=80";

/* ── STORAGE ─────────────────────────────────────────────────────── */
const StorageService = {
  get: () => JSON.parse(localStorage.getItem('ai_fashion_v2') || '[]'),
  save(design) {
    const cols = this.get();
    const nd = { ...design, id: Date.now(), isTracking: false };
    localStorage.setItem('ai_fashion_v2', JSON.stringify([nd, ...cols]));
    return nd;
  },
  delete(id) {
    localStorage.setItem('ai_fashion_v2', JSON.stringify(this.get().filter(d => d.id !== id)));
  },
  toggleTrack(id) {
    const updated = this.get().map(d => d.id === id ? { ...d, isTracking: !d.isTracking } : d);
    localStorage.setItem('ai_fashion_v2', JSON.stringify(updated));
    return updated;
  }
};

/* ── AI SERVICES ─────────────────────────────────────────────────── */
const FashionService = {
  async spec(prompt) {
    if (!GEMINI_KEY) return this.mock(prompt);
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`;
      const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{parts:[{text:`Fashion JSON: ${prompt}. Schema:{category,fabric,colors:[hex],sustainability_score,budget:{maximum}}`}]}], generationConfig:{responseMimeType:"application/json"} })
      });
      const d = await res.json();
      const txt = d.candidates[0].content.parts[0].text;
      const m = txt.match(/```(?:json)?\n([\s\S]*?)\n```/);
      return JSON.parse(m ? m[1] : txt);
    } catch { return this.mock(prompt); }
  },
  mock: p => ({
    category: p.toLowerCase().includes('kurta') ? 'Kurta' : p.toLowerCase().includes('saree') ? 'Saree' : 'Jacket',
    fabric: 'Organic Cotton', colors: ['#0f172a','#334155','#94a3b8'],
    sustainability_score: 85, budget: { maximum: 2999 }, optimized_image_prompt: p
  })
};

const ImageService = {
  async generate(prompt, modelId) {
    // ── Primary: Cloudflare Workers AI via /api/design ──────────────
    try {
      const body = { prompt };
      if (modelId) body.model = modelId;
      const res = await fetch(`${BACKEND_URL}/api/design`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        const d = await res.json();
        // DesignResponse: { success: true, image: "data:image/png;base64,…" }
        if (d.success && d.image) return d.image;
      } else {
        // ErrorResponse from Cloudflare route: { success: false, error: { code, message } }
        // Legacy HTTPException from HuggingFace route: { detail: { fallback_url } }
        const err = await res.json().catch(() => ({}));
        if (err?.detail?.fallback_url) return err.detail.fallback_url;
        // Cloudflare route returns ErrorResponse (no fallback_url) — fall through to HF route
      }
    } catch {
      // Backend not running — fall through to HuggingFace legacy route
    }
    // ── Fallback: HuggingFace legacy route /api/generate-image ──────
    try {
      const res = await fetch(`${BACKEND_URL}/api/generate-image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });
      if (res.ok) {
        const d = await res.json();
        if (d.image_base64) return d.image_base64;
      } else {
        const e = await res.json().catch(() => ({}));
        if (e?.detail?.fallback_url) return e.detail.fallback_url;
      }
    } catch {
      // HuggingFace route also unavailable — use static fallback
    }
    return FALLBACK_IMG;
  }
};

const ShopService = {
  async search(spec) {
    await new Promise(r => setTimeout(r, 400));
    return [
      { name: "Minimalist " + spec.category, price: 1499, platform: "Myntra", score: 92, tag: "Best Match" },
      { name: "Premium " + spec.fabric + " Blend", price: 2199, platform: "Ajio", score: 88, tag: "Popular" },
      { name: "Urban Streetwear Concept", price: 2899, platform: "Tata CLiQ", score: 85, tag: "Trending" }
    ];
  }
};

const TryOnService = {
  async process(personImg, garmentImg) {
    return new Promise(resolve => setTimeout(() => {
      const canvas = document.createElement('canvas'), scratch = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const pImg = new Image(), gImg = new Image();
      pImg.crossOrigin = gImg.crossOrigin = "anonymous";
      pImg.onload = () => {
        const W = pImg.width, H = pImg.height;
        canvas.width = scratch.width = W; canvas.height = scratch.height = H;
        gImg.onload = () => {
          ctx.drawImage(pImg, 0, 0, W, H);
          const sc = scratch.getContext('2d');
          const torsoTop = H * 0.18, torsoH = H * 0.67;
          const gW = W, gH = gW / (gImg.width / gImg.height);
          sc.drawImage(gImg, 0, torsoTop - (gH - torsoH) * 0.15, gW, gH);
          ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.82;
          ctx.drawImage(scratch, 0, 0); ctx.restore();
          ctx.drawImage(pImg, 0, 0, W, H * 0.22, 0, 0, W, H * 0.22);
          const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
          vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.18)');
          ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        gImg.src = garmentImg;
      };
      pImg.src = personImg;
    }, 2500));
  }
};

/* ── DATA ────────────────────────────────────────────────────────── */
const IMAGE_MODELS = [
  { id:"@cf/black-forest-labs/flux-1-schnell",            label:"FLUX.1 Schnell",   badge:"Fast",    bc:"text-sky-400 bg-sky-400/10 border-sky-400/20",    desc:"Best quality/speed for fashion renders", def:true },
  { id:"@cf/stabilityai/stable-diffusion-xl-base-1.0",    label:"SDXL Base 1.0",    badge:"Detail",  bc:"text-violet-400 bg-violet-400/10 border-violet-400/20", desc:"Higher detail, slightly slower" },
  { id:"@cf/lykon/dreamshaper-8-lcm",                     label:"DreamShaper 8",    badge:"Art",     bc:"text-rose-400 bg-rose-400/10 border-rose-400/20",   desc:"Painterly, creative illustrations" },
  { id:"@cf/bytedance/stable-diffusion-xl-lightning",     label:"SDXL Lightning",   badge:"Fastest", bc:"text-emerald-400 bg-emerald-400/10 border-emerald-400/20", desc:"Ultra-fast 4-step generation" },
];

const RUNWAY = [
  { id:1, prompt:"Cyberpunk streetwear jacket with neon accents",             image:"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=800&q=80", tag:"Trending", designer:"Studio AI",   likes:284 },
  { id:2, prompt:"Indo-western fusion lehenga, minimalist beige",             image:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=800&q=80", tag:"Featured", designer:"Runway AI",   likes:521 },
  { id:3, prompt:"Sustainable bamboo fabric summer dress",                     image:"https://images.unsplash.com/photo-1515347619362-e5fdffdc8fb8?w=800&q=80", tag:"Eco Pick", designer:"Green Studio", likes:193 },
  { id:4, prompt:"Royal Rajasthani bandhani kurta in indigo with gold print",  image:"https://images.unsplash.com/photo-1583391733956-6c78276477e2?w=800&q=80", tag:"New",      designer:"Heritage AI",  likes:412 },
  { id:5, prompt:"Oversized linen co-ord set, soft terracotta tones",          image:"https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&q=80", tag:"Minimal",  designer:"Form Studio",  likes:337 },
  { id:6, prompt:"Contemporary silk saree with geometric motif border",        image:"https://images.unsplash.com/photo-1617137968427-85924c800a22?w=800&q=80", tag:"Classic",  designer:"Loom AI",      likes:609 },
];
const TAG_CLS = { Trending:"bg-rose-500/15 text-rose-400 border-rose-500/30", Featured:"bg-violet-500/15 text-violet-400 border-violet-500/30", "Eco Pick":"bg-emerald-500/15 text-emerald-400 border-emerald-500/30", New:"bg-sky-500/15 text-sky-400 border-sky-500/30", Minimal:"bg-neutral-500/15 text-neutral-400 border-neutral-500/30", Classic:"bg-amber-500/15 text-amber-400 border-amber-500/30" };
const STATS = [{ v:"48K+", l:"Designs Generated" },{ v:"12K", l:"Active Designers" },{ v:"87/100", l:"Avg. Eco Score" },{ v:"200+", l:"Indian Styles" }];

/* ═══════════════════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════════════════ */
function App() {
  const [tab, setTab]           = useState('runway');
  const [prompt, setPrompt]     = useState('');
  const [model, setModel]       = useState(IMAGE_MODELS.find(m=>m.def).id);
  const [dropOpen, setDropOpen] = useState(false);
  const [job, setJob]           = useState({ status:'idle', spec:null, image:null, products:[] });
  const [bigImg, setBigImg]     = useState(null);
  const [techPack, setTechPack] = useState(false);
  const [personImg, setPersonImg]   = useState(null);
  const [tryJob, setTryJob]         = useState({ status:'idle', result:null });
  const [bodyAI, setBodyAI]         = useState(null);
  const [saved, setSaved]           = useState([]);
  const [savePulse, setSavePulse]   = useState(false);
  const fileRef  = useRef(null);
  const dropRef  = useRef(null);

  useEffect(() => { setSaved(StorageService.get()); }, []);
  useEffect(() => {
    const h = e => { if (dropRef.current && !dropRef.current.contains(e.target)) setDropOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const generate = async (override = null) => {
    const p = (override || prompt).trim();
    if (!p) return;
    setPrompt(p);
    if (tab !== 'design') setTab('design');
    setJob({ status:'processing', spec:null, image:null, products:[] });
    try {
      const spec = await FashionService.spec(p);
      const [image, products] = await Promise.all([
        ImageService.generate(spec.optimized_image_prompt || p, model),
        ShopService.search(spec)
      ]);
      setJob({ status:'completed', spec, image, products, prompt: p });
    } catch { setJob({ status:'failed', spec:null, image:null, products:[] }); }
  };

  const saveDesign = () => {
    StorageService.save({ image: job.image, prompt: job.prompt, spec: job.spec });
    setSaved(StorageService.get());
    setSavePulse(true); setTimeout(() => setSavePulse(false), 1200);
  };

  const uploadPerson = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      setPersonImg(ev.target.result); setBodyAI(null);
      setTimeout(() => setBodyAI({ shape:'Athletic / Rectangle', tips:'Structured shoulders and a cinched waist will complement your proportions.' }), 2200);
    };
    reader.readAsDataURL(file);
  };

  const tryon = async () => {
    if (!personImg || !job.image) return;
    setTryJob({ status:'processing', result:null });
    const result = await TryOnService.process(personImg, job.image);
    setTryJob({ status:'completed', result });
  };

  const tabs = [
    { id:'runway',     label:'Runway',                  icon:'Activity'  },
    { id:'design',     label:'Studio',                  icon:'Sparkles'  },
    { id:'tryon',      label:'Try-On',                  icon:'User'      },
    { id:'collection', label:`Saved · ${saved.length}`, icon:'Layers'    },
  ];
  const activeModel = IMAGE_MODELS.find(m => m.id === model);

  return (
    <div className="min-h-screen bg-[#080808] text-neutral-100 antialiased" style={{fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'}}>

      {/* LIGHTBOX */}
      {bigImg && (
        <div className="fixed inset-0 z-[200] bg-black/96 flex items-center justify-center p-4" onClick={() => setBigImg(null)}>
          <button className="absolute top-5 right-5 bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-full border border-white/10">
            <Icon name="X" size={20} />
          </button>
          <img src={bigImg} className="max-w-[90vw] max-h-[90vh] rounded-2xl object-contain shadow-2xl" onClick={e=>e.stopPropagation()} />
        </div>
      )}

      {/* TECH PACK */}
      {techPack && job.spec && (
        <div className="fixed inset-0 z-[200] bg-black/85 flex items-center justify-center p-4">
          <div className="bg-[#0e0e0e] border border-neutral-800/80 rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl">
            <div className="flex justify-between items-center px-6 py-4 border-b border-neutral-800/60 bg-[#0a0a0a]">
              <h2 className="font-semibold text-sm flex items-center gap-2 text-neutral-200">
                <Icon name="FileText" size={15} className="text-violet-400" /> Manufacturing Tech Pack
              </h2>
              <button onClick={() => setTechPack(false)} className="text-neutral-500 hover:text-white p-1"><Icon name="X" size={18} /></button>
            </div>
            <div className="p-6 space-y-5">
              <div className="grid grid-cols-2 gap-3">
                {[["Primary Fabric", job.spec.fabric||"Unknown"],["Category",job.spec.category||"Apparel"],["Color Codes",job.spec.colors?.join(", ")||"N/A"],["Est. Cost",`₹${((job.spec.budget?.maximum||0)*0.4).toFixed(0)}`]].map(([l,v])=>(
                  <div key={l} className="bg-neutral-900/60 border border-neutral-800/60 p-3 rounded-xl">
                    <span className="text-neutral-500 text-[10px] uppercase tracking-wider block mb-1">{l}</span>
                    <span className="text-neutral-200 text-sm font-medium">{v}</span>
                  </div>
                ))}
              </div>
              <div className="bg-neutral-900/40 border border-neutral-800/50 p-4 rounded-xl">
                <h4 className="text-xs font-semibold text-neutral-300 mb-2 uppercase tracking-wider">Construction Notes</h4>
                <ul className="space-y-1.5 text-xs text-neutral-500 list-disc pl-4">
                  <li>Standard 1.5 cm seam allowance on all panels.</li>
                  <li>Eco-friendly dyes — target Eco Score: <span className="text-emerald-400">{job.spec.sustainability_score||80}/100</span>.</li>
                  <li className="text-neutral-600 italic line-clamp-1">Derived from: "{job.prompt}"</li>
                </ul>
              </div>
              <button onClick={()=>setTechPack(false)} className="w-full bg-white text-black py-2.5 rounded-xl text-sm font-semibold hover:bg-neutral-100">
                Download PDF <span className="text-neutral-400 font-normal">(Simulated)</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* NAV */}
      <nav className="sticky top-0 z-50 border-b border-neutral-900/80 bg-[#080808]/90" style={{backdropFilter:'blur(24px)'}}>
        <div className="max-w-7xl mx-auto px-5 h-14 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="bg-white text-black p-1.5 rounded-lg"><Icon name="Scissors" size={15} /></div>
            <span className="font-semibold text-[15px] tracking-tight hidden sm:block">AI Fashion Studio</span>
            <span className="ml-1 text-[10px] font-medium text-violet-400 bg-violet-400/10 border border-violet-400/20 px-1.5 py-0.5 rounded-md hidden sm:inline">BETA</span>
          </div>
          <div className="flex items-center gap-0.5 bg-neutral-900/60 border border-neutral-800/60 p-1 rounded-xl overflow-x-auto">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`relative px-3.5 py-1.5 rounded-lg text-[13px] font-medium flex items-center gap-1.5 whitespace-nowrap transition-all ${tab===t.id?'bg-neutral-800 text-white':'text-neutral-500 hover:text-neutral-300 hover:bg-neutral-800/40'}`}>
                <Icon name={t.icon} size={13} /> {t.label}
                {t.id==='collection' && saved.length>0 && tab!=='collection' && (
                  <span className="absolute -top-1 -right-1 bg-violet-500 text-white text-[9px] font-bold rounded-full w-3.5 h-3.5 flex items-center justify-center">{saved.length>9?'9+':saved.length}</span>
                )}
              </button>
            ))}
          </div>
        </div>
      </nav>

      <main className="max-w-7xl mx-auto px-5 py-8">

        {/* ══ RUNWAY ══ */}
        {tab === 'runway' && (
          <div className="space-y-10">
            {/* Hero */}
            <div className="relative rounded-3xl overflow-hidden bg-gradient-to-br from-neutral-900 via-[#0e0e0e] to-neutral-900 border border-neutral-800/60 p-10 md:p-14 text-center">
              <div className="absolute inset-0 opacity-[0.03]" style={{backgroundImage:'linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px)',backgroundSize:'40px 40px'}} />
              <div className="relative z-10">
                <div className="inline-flex items-center gap-2 bg-violet-500/10 border border-violet-500/20 text-violet-300 text-xs font-medium px-3 py-1.5 rounded-full mb-5">
                  <Icon name="Zap" size={11} /> AI-Powered Fashion Intelligence
                </div>
                <h1 className="text-4xl md:text-5xl font-bold text-white mb-4 leading-tight tracking-tight">Design. Try. Wear.</h1>
                <p className="text-neutral-400 text-base max-w-lg mx-auto mb-8 leading-relaxed">Describe any outfit in plain language — our AI renders it, suggests real alternatives, and lets you try it on.</p>
                <div className="flex flex-col sm:flex-row gap-3 justify-center">
                  <button onClick={() => setTab('design')} className="inline-flex items-center justify-center gap-2 bg-white text-black px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-neutral-100">

                        <div className="flex gap-2.5 items-center">
                          <button onClick={() => generate(d.prompt)} className="text-neutral-600 hover:text-violet-400" title="Remix" style={{transition:'color .15s'}}><Icon name="RefreshCw" size={12} /></button>
                          <button onClick={() => { StorageService.delete(d.id); setSaved(StorageService.get()); }} className="text-neutral-700 hover:text-red-400" title="Delete" style={{transition:'color .15s'}}><Icon name="Trash2" size={12} /></button>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

// Hide the loading splash once React renders successfully
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
// Use a short timeout so the first paint completes before removing the splash
setTimeout(hideSplash, 150);
</script>
</body>
</html>
