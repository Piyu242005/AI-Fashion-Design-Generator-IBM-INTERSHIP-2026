/* ─────────────────────────────────────────────────────────────────────────
   Pure React.createElement — no Babel, no JSX, loads instantly
───────────────────────────────────────────────────────────────────────── */
const { useState, useRef, useEffect, createElement: h, Fragment } = React;

/* ── Hide splash ──────────────────────────────────────────────────────── */
function hideSplash() {
  const el = document.getElementById('loading-splash');
  if (el) { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }
}

/* ── Lucide icon (pure JS, no JSX) ───────────────────────────────────── */
function Icon({ name, size=16, className='' }) {
  if (!window.lucide) return h('span',{style:{display:'inline-block',width:size,height:size}});
  const key = name.charAt(0).toUpperCase()+name.slice(1);
  const def = window.lucide[key]||window.lucide['HelpCircle'];
  if (!def||!Array.isArray(def)) return h('span',{style:{display:'inline-block',width:size,height:size}});
  const children = (def[2]||[]).map(([tag,attrs],i)=>{
    const fixed={};
    for(const [k,v] of Object.entries(attrs||{}))
      fixed[k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=v;
    if(['path','circle','line','rect','polyline','polygon','ellipse'].includes(tag))
      return h(tag,{key:i,...fixed});
    return null;
  });
  return h('svg',{
    xmlns:'http://www.w3.org/2000/svg',width:size,height:size,
    viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',
    strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',
    className:`inline-block shrink-0 ${className}`,
    style:{verticalAlign:'middle'}
  },...children);
}

/* ── CONFIG ───────────────────────────────────────────────────────────── */
const BACKEND_URL  = 'https://ai-fashion-design-generator-ibm.onrender.com';
// Gemini key: paste here OR add <meta name="gemini-key" content="AIza..."> in <head>
const GEMINI_KEY   = (document.querySelector('meta[name="gemini-key"]')?.content)||'';
const GEMINI_MODEL = 'gemini-2.5-flash';
const FALLBACK_IMG = 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&q=80';

/* ── STORAGE ──────────────────────────────────────────────────────────── */
const Store = {
  get:()=>JSON.parse(localStorage.getItem('ai_fashion_v2')||'[]'),
  save(d){ const a=this.get(); const nd={...d,id:Date.now(),isTracking:false}; localStorage.setItem('ai_fashion_v2',JSON.stringify([nd,...a])); return nd; },
  del(id){ localStorage.setItem('ai_fashion_v2',JSON.stringify(this.get().filter(d=>d.id!==id))); },
  toggleTrack(id){ const u=this.get().map(d=>d.id===id?{...d,isTracking:!d.isTracking}:d); localStorage.setItem('ai_fashion_v2',JSON.stringify(u)); return u; }
};

/* ── PROMPT OPTIMIZER ─────────────────────────────────────────────────── */
// Rewrites any user prompt into a clean FLUX-friendly fashion image prompt.
// Works without Gemini — pure keyword extraction + template injection.
const PromptOptimizer = {
  // Strip photography/camera/lighting jargon that confuses FLUX
  _stripJargon(p) {
    return p
      .replace(/\b(85mm|50mm|35mm|portrait lens|shallow depth of field|bokeh|DSLR|cinematic|photorealistic|4K|ultra-detailed|color grading|natural lighting|golden[- ]hour|warm light|soft light|high detail|realistic skin texture|detailed fabric texture|premium|professional photography|wedding photography|affectionate pose|natural pose|graceful|sophisticated)\b/gi,'')
      .replace(/,\s*,/g,',').replace(/\s+/g,' ').trim();
  },
  // Extract the core fashion subject (what + who + colors)
  _extract(p) {
    const lower = p.toLowerCase();
    // Detect garments
    const garments = ['saree','lehenga','kurta','sherwani','blazer','jacket','dress','suit','co-ord','anarkali','sharara','dupatta'];
    const found = garments.filter(g=>lower.includes(g));
    // Detect colors
    const colors = ['red','blue','green','yellow','orange','pink','purple','white','black','gold','silver','beige','ivory','maroon','navy','teal','emerald','crimson','deep red','royal blue'];
    const foundColors = colors.filter(c=>lower.includes(c));
    // Detect subject (person/couple)
    const isCouple = lower.includes('couple') || lower.includes('two people') || lower.includes('man and woman');
    const isWoman = lower.includes('woman') || lower.includes('girl') || lower.includes('bride') || lower.includes('she');
    const isMan   = lower.includes('man') || lower.includes('groom') || lower.includes('he') || lower.includes('kurta');
    return { garments:found, colors:foundColors, isCouple, isWoman, isMan };
  },
  optimize(userPrompt) {
    const info = this._extract(userPrompt);
    const clean = this._stripJargon(userPrompt);

    // Build a structured FLUX prompt: subject → garment → style → quality
    const subject = info.isCouple
      ? 'Indian couple'
      : info.isWoman ? 'Indian woman'
      : info.isMan   ? 'Indian man'
      : 'fashion model';

    const garmentDesc = info.garments.length
      ? info.garments.join(' and ')
      : clean.split(',')[0]; // first phrase

    const colorDesc = info.colors.slice(0,2).join(' and ');

    const styleTag = info.garments.some(g=>['saree','lehenga','anarkali','sharara'].includes(g))
      ? 'traditional Indian ethnic wear, intricate embroidery, studio fashion photography'
      : 'contemporary Indian fashion, clean studio background, fashion photography';

    return `${subject} wearing ${colorDesc ? colorDesc+' ' : ''}${garmentDesc}, ${styleTag}, sharp focus, high quality`;
  }
};

/* ── AI SERVICES ──────────────────────────────────────────────────────── */
const FashionService = {
  async spec(prompt) {
    // Always build an optimized image prompt client-side first
    const optimized_image_prompt = PromptOptimizer.optimize(prompt);

    if (!GEMINI_KEY) return this.mock(prompt, optimized_image_prompt);
    try {
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`;
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          contents:[{parts:[{text:`Extract fashion details as JSON from this prompt: "${prompt}". Return ONLY valid JSON matching exactly: {"category":"","fabric":"","colors":["#hex1","#hex2","#hex3"],"sustainability_score":80,"budget":{"maximum":3000},"optimized_image_prompt":""} — fill optimized_image_prompt with a short clean image generation prompt describing only the clothing/outfit, max 30 words, no camera terms.`}]}],
          generationConfig:{responseMimeType:'application/json'}
        })});
      const d=await res.json();
      const txt=d.candidates[0].content.parts[0].text;
      const m=txt.match(/```(?:json)?\n([\s\S]*?)\n```/);
      const parsed=JSON.parse(m?m[1]:txt);
      // Always ensure optimized_image_prompt is set — fallback to local optimizer
      if (!parsed.optimized_image_prompt || parsed.optimized_image_prompt.length < 10)
        parsed.optimized_image_prompt = optimized_image_prompt;
      return parsed;
    } catch { return this.mock(prompt, optimized_image_prompt); }
  },
  mock:(p, optimized)=>({
    category:p.toLowerCase().includes('kurta')?'Kurta':p.toLowerCase().includes('saree')?'Saree':p.toLowerCase().includes('lehenga')?'Lehenga':p.toLowerCase().includes('blazer')?'Blazer':'Outfit',
    fabric:'Silk',
    colors:p.toLowerCase().includes('red')||p.toLowerCase().includes('maroon')?['#8B0000','#C41E3A','#FFD700']:
           p.toLowerCase().includes('blue')?['#0f172a','#1e3a5f','#94a3b8']:
           p.toLowerCase().includes('green')?['#14532d','#166534','#86efac']:
           ['#0f172a','#334155','#94a3b8'],
    sustainability_score:85,
    budget:{maximum:4999},
    optimized_image_prompt: optimized || PromptOptimizer.optimize(p)
  })
};

const ImageService = {
  async generate(prompt, modelId) {
    try {
      const body = { prompt };
      if (modelId) body.model = modelId;
      const res = await fetch(`${BACKEND_URL}/api/design`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.success && d.image && d.image.startsWith('data:')) return d.image;
      if (d?.error?.fallback_url) return d.error.fallback_url;
    } catch {}
    return FALLBACK_IMG;
  }
};

const ShopService = {
  async search(spec) {
    await new Promise(r=>setTimeout(r,400));
    return [
      {name:'Minimalist '+spec.category,     price:1499,platform:'Myntra',   score:92,tag:'Best Match'},
      {name:'Premium '+spec.fabric+' Blend', price:2199,platform:'Ajio',     score:88,tag:'Popular'},
      {name:'Urban Streetwear Concept',       price:2899,platform:'Tata CLiQ',score:85,tag:'Trending'},
    ];
  }
};

const TryOnService = {
  process(personImg, garmentImg) {
    return new Promise(resolve => {
      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');
      const pImg   = new Image();
      const gImg   = new Image();
      pImg.crossOrigin = gImg.crossOrigin = 'anonymous';

      pImg.onload = () => {
        const W = pImg.naturalWidth  || pImg.width;
        const H = pImg.naturalHeight || pImg.height;
        canvas.width  = W;
        canvas.height = H;

        gImg.onload = () => {
          // 1. Draw full person as base layer
          ctx.drawImage(pImg, 0, 0, W, H);

          // 2. Draw garment over torso — source-over, semi-transparent
          //    Torso region: top=18% … bottom=85% of frame height
          const torsoTop = H * 0.18;
          const torsoH   = H * 0.67;           // 85% - 18%
          const scale    = W / gImg.naturalWidth;
          const gH       = gImg.naturalHeight * scale;
          // Centre the garment vertically inside the torso band
          const gY       = torsoTop + (torsoH - gH) * 0.5;

          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 0.88;
          ctx.drawImage(gImg, 0, gY, W, gH);
          ctx.restore();

          // 3. Re-draw person's head/neck region on top at full opacity
          //    so it is never obscured by the garment layer
          const headH = H * 0.25;
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.drawImage(pImg, 0, 0, W, headH, 0, 0, W, headH);
          ctx.restore();

          // 4. Subtle vignette for polish
          const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
          vg.addColorStop(0, 'rgba(0,0,0,0)');
          vg.addColorStop(1, 'rgba(0,0,0,0.15)');
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, W, H);

          setTimeout(() => resolve(canvas.toDataURL('image/jpeg', 0.92)), 2500);
        };

        gImg.onerror = () => resolve(canvas.toDataURL('image/jpeg', 0.92));
        gImg.src = garmentImg;
      };

      pImg.onerror = () => resolve(personImg); // fallback: return original
      pImg.src = personImg;
    });
  }
};

/* ── DATA ─────────────────────────────────────────────────────────────── */
const IMAGE_MODELS=[
  {id:'@cf/black-forest-labs/flux-1-schnell',         label:'FLUX.1 Schnell',  badge:'Fast',    provider:'Cloudflare', bc:'text-sky-400 bg-sky-400/10 border-sky-400/20',          desc:'Best quality/speed for fashion renders',def:true},
  {id:'@cf/stabilityai/stable-diffusion-xl-base-1.0', label:'SDXL Base 1.0',   badge:'Detail',  provider:'Cloudflare', bc:'text-violet-400 bg-violet-400/10 border-violet-400/20',  desc:'Higher detail, slightly slower'},
  {id:'@cf/lykon/dreamshaper-8-lcm',                  label:'DreamShaper 8',   badge:'Art',     provider:'Cloudflare', bc:'text-rose-400 bg-rose-400/10 border-rose-400/20',         desc:'Painterly, creative illustrations'},
  {id:'@cf/bytedance/stable-diffusion-xl-lightning',  label:'SDXL Lightning',  badge:'Fastest', provider:'Cloudflare', bc:'text-emerald-400 bg-emerald-400/10 border-emerald-400/20',desc:'Ultra-fast 4-step generation'},
];

const RUNWAY=[
  {id:1,prompt:'Cyberpunk streetwear jacket with neon accents',            image:'https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=800&q=80',tag:'Trending',designer:'Studio AI',  likes:284},
  {id:2,prompt:'Indo-western fusion lehenga, minimalist beige',            image:'https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=800&q=80',tag:'Featured',designer:'Runway AI',  likes:521},
  {id:3,prompt:'Sustainable bamboo fabric summer dress',                    image:'https://images.unsplash.com/photo-1515347619362-e5fdffdc8fb8?w=800&q=80',tag:'Eco Pick',designer:'Green Studio',likes:193},
  {id:4,prompt:'Royal Rajasthani bandhani kurta in indigo with gold print', image:'https://images.unsplash.com/photo-1583391733956-6c78276477e2?w=800&q=80',tag:'New',     designer:'Heritage AI', likes:412},
  {id:5,prompt:'Oversized linen co-ord set, soft terracotta tones',         image:'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&q=80',tag:'Minimal', designer:'Form Studio', likes:337},
  {id:6,prompt:'Contemporary silk saree with geometric motif border',       image:'https://images.unsplash.com/photo-1617137968427-85924c800a22?w=800&q=80',tag:'Classic', designer:'Loom AI',     likes:609},
];
const TAG_CLS={
  Trending:'bg-rose-500/15 text-rose-400 border-rose-500/30',
  Featured:'bg-violet-500/15 text-violet-400 border-violet-500/30',
  'Eco Pick':'bg-emerald-500/15 text-emerald-400 border-emerald-500/30',
  New:'bg-sky-500/15 text-sky-400 border-sky-500/30',
  Minimal:'bg-neutral-500/15 text-neutral-400 border-neutral-500/30',
  Classic:'bg-amber-500/15 text-amber-400 border-amber-500/30',
};
const STATS=[{v:'48K+',l:'Designs Generated'},{v:'12K',l:'Active Designers'},{v:'87/100',l:'Avg. Eco Score'},{v:'200+',l:'Indian Styles'}];

/* ═══════════════════════════════════════════════════════════════════════
   APP COMPONENT
═══════════════════════════════════════════════════════════════════════ */
function App() {
  const [tab,setTab]             = useState('runway');
  const [prompt,setPrompt]       = useState('');
  const [model,setModel]         = useState(IMAGE_MODELS.find(m=>m.def).id);
  const [dropOpen,setDropOpen]   = useState(false);
  const [job,setJob]             = useState({status:'idle',spec:null,image:null,products:[]});
  const [bigImg,setBigImg]       = useState(null);
  const [techPack,setTechPack]   = useState(false);
  const [personImg,setPersonImg] = useState(null);
  const [tryJob,setTryJob]       = useState({status:'idle',result:null});
  const [bodyAI,setBodyAI]       = useState(null);
  const [saved,setSaved]         = useState([]);
  const [savePulse,setSavePulse] = useState(false);
  const fileRef = useRef(null);
  const dropRef = useRef(null);

  useEffect(()=>{ setSaved(Store.get()); },[]);
  useEffect(()=>{
    const h=e=>{ if(dropRef.current&&!dropRef.current.contains(e.target)) setDropOpen(false); };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);

  const generate = async (override=null) => {
    const p=(override||prompt).trim(); if(!p) return;
    setPrompt(p);
    if(tab!=='design') setTab('design');
    setJob({status:'processing',spec:null,image:null,products:[]});
    try {
      const spec=await FashionService.spec(p);
      const [image,products]=await Promise.all([
        ImageService.generate(spec.optimized_image_prompt||p,model),
        ShopService.search(spec)
      ]);
      setJob({status:'completed',spec,image,products,prompt:p});
    } catch { setJob({status:'failed',spec:null,image:null,products:[]}); }
  };

  const saveDesign=()=>{
    Store.save({image:job.image,prompt:job.prompt,spec:job.spec});
    setSaved(Store.get()); setSavePulse(true); setTimeout(()=>setSavePulse(false),1200);
  };

  const uploadPerson=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      setPersonImg(ev.target.result); setBodyAI(null);
      setTimeout(()=>setBodyAI({shape:'Athletic / Rectangle',tips:'Structured shoulders and a cinched waist will complement your proportions.'}),2200);
    };
    reader.readAsDataURL(file);
  };

  const tryon=async()=>{
    if(!personImg||!job.image) return;
    setTryJob({status:'processing',result:null});
    const result=await TryOnService.process(personImg,job.image);
    setTryJob({status:'completed',result});
  };

  const tabs=[
    {id:'runway',     label:'Runway',                 icon:'Activity'},
    {id:'design',     label:'Studio',                 icon:'Sparkles'},
    {id:'tryon',      label:'Try-On',                 icon:'User'},
    {id:'collection', label:`Saved · ${saved.length}`,icon:'Layers'},
  ];
  const activeModel=IMAGE_MODELS.find(m=>m.id===model);

  /* helper: clx(cond, yes, no) */
  const cx=(...args)=>args.filter(Boolean).join(' ');

  return h('div',{className:'min-h-screen bg-[#080808] text-neutral-100 antialiased',style:{fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'}},

    /* ── LIGHTBOX ── */
    bigImg && h('div',{className:'fixed inset-0 z-[200] bg-black/96 flex items-center justify-center p-4',onClick:()=>setBigImg(null)},
      h('button',{className:'absolute top-5 right-5 bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-full border border-white/10'},h(Icon,{name:'X',size:20})),
      h('img',{src:bigImg,className:'max-w-[90vw] max-h-[90vh] rounded-2xl object-contain shadow-2xl',onClick:e=>e.stopPropagation()})
    ),

    /* ── TECH PACK MODAL ── */
    (techPack&&job.spec) && h('div',{className:'fixed inset-0 z-[200] bg-black/85 flex items-center justify-center p-4'},
      h('div',{className:'bg-[#0e0e0e] border border-neutral-800/80 rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl'},
        h('div',{className:'flex justify-between items-center px-6 py-4 border-b border-neutral-800/60 bg-[#0a0a0a]'},
          h('h2',{className:'font-semibold text-sm flex items-center gap-2 text-neutral-200'},h(Icon,{name:'FileText',size:15,className:'text-violet-400'}),' Manufacturing Tech Pack'),
          h('button',{onClick:()=>setTechPack(false),className:'text-neutral-500 hover:text-white p-1'},h(Icon,{name:'X',size:18}))
        ),
        h('div',{className:'p-6 space-y-5'},
          h('div',{className:'grid grid-cols-2 gap-3'},
            [['Primary Fabric',job.spec.fabric||'Unknown'],['Category',job.spec.category||'Apparel'],
             ['Color Codes',(job.spec.colors||[]).join(', ')||'N/A'],['Est. Cost',`₹${((job.spec.budget?.maximum||0)*0.4).toFixed(0)}`]]
            .map(([l,v])=>h('div',{key:l,className:'bg-neutral-900/60 border border-neutral-800/60 p-3 rounded-xl'},
              h('span',{className:'text-neutral-500 text-[10px] uppercase tracking-wider block mb-1'},l),
              h('span',{className:'text-neutral-200 text-sm font-medium'},v)
            ))
          ),
          h('div',{className:'bg-neutral-900/40 border border-neutral-800/50 p-4 rounded-xl'},
            h('h4',{className:'text-xs font-semibold text-neutral-300 mb-2 uppercase tracking-wider'},'Construction Notes'),
            h('ul',{className:'space-y-1.5 text-xs text-neutral-500 list-disc pl-4'},
              h('li',null,'Standard 1.5 cm seam allowance on all panels.'),
              h('li',null,'Eco-friendly dyes — target Eco Score: ',h('span',{className:'text-emerald-400'},`${job.spec.sustainability_score||80}/100`),'.'),
              h('li',{className:'text-neutral-600 italic line-clamp-1'},`Derived from: "${job.prompt||''}"`)
            )
          ),
          h('button',{onClick:()=>setTechPack(false),className:'w-full bg-white text-black py-2.5 rounded-xl text-sm font-semibold hover:bg-neutral-100'},
            'Download PDF ',h('span',{className:'text-neutral-400 font-normal'},'(Simulated)')
          )
        )
      )
    ),

    /* ── NAV ── */
    h('nav',{className:'sticky top-0 z-50 border-b border-neutral-900/80 bg-[#080808]/90',style:{backdropFilter:'blur(24px)'}},
      h('div',{className:'max-w-7xl mx-auto px-5 h-14 flex items-center justify-between'},
        h('div',{className:'flex items-center gap-2.5'},
          h('div',{className:'bg-white text-black p-1.5 rounded-lg'},h(Icon,{name:'Scissors',size:15})),
          h('span',{className:'font-semibold text-[15px] tracking-tight hidden sm:block'},'AI Fashion Studio'),
          h('span',{className:'ml-1 text-[10px] font-medium text-violet-400 bg-violet-400/10 border border-violet-400/20 px-1.5 py-0.5 rounded-md hidden sm:inline'},'BETA'),
          h('span',{className:'ml-2 text-[10px] text-neutral-600 hidden md:inline'},'by Piyush Ramteke')
        ),
        h('div',{className:'flex items-center gap-0.5 bg-neutral-900/60 border border-neutral-800/60 p-1 rounded-xl overflow-x-auto'},
          tabs.map(t=>h('button',{key:t.id,onClick:()=>setTab(t.id),

        saved.length===0
          ? h('div',{className:'bg-neutral-900/30 border border-neutral-800/40 rounded-2xl p-16 text-center'},
              h('div',{className:'w-12 h-12 bg-neutral-800/60 rounded-2xl flex items-center justify-center mx-auto mb-4'},h(Icon,{name:'Layers',size:20,className:'text-neutral-600'})),
              h('p',{className:'text-sm text-neutral-500 mb-1'},'No designs saved yet'),
              h('p',{className:'text-xs text-neutral-700 mb-4'},'Generate a design and hit "Save Design" to build your collection'),
              h('button',{onClick:()=>setTab('design'),className:'inline-flex items-center gap-2 text-xs text-violet-400 bg-violet-400/10 border border-violet-400/20 px-4 py-2 rounded-lg hover:bg-violet-400/20'},
                h(Icon,{name:'Sparkles',size:11}),' Go to Studio')
            )
          : h('div',{className:'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4'},
              saved.map(d=>h('div',{key:d.id,className:'bg-neutral-900/40 border border-neutral-800/50 rounded-2xl overflow-hidden flex flex-col group',style:{transition:'all .3s'}},
                h('div',{className:'h-52 overflow-hidden bg-neutral-950 relative'},
                  h('img',{src:d.image,className:'w-full h-full object-cover',style:{transition:'transform .5s'}}),
                  h('button',{onClick:()=>setBigImg(d.image),
                    className:'absolute top-2 right-2 bg-black/50 p-1.5 rounded-lg text-white/70 hover:text-white border border-white/10 opacity-0 group-hover:opacity-100',
                    style:{backdropFilter:'blur(4px)',transition:'opacity .2s'}},h(Icon,{name:'Maximize2',size:12}))
                ),
                h('div',{className:'p-3.5 flex flex-col gap-2.5 flex-1'},
                  h('p',{className:'text-[11px] text-neutral-400 line-clamp-2 leading-relaxed flex-1'},d.prompt),
                  d.spec && h('div',{className:'flex gap-1 items-center'},
                    (d.spec.colors||[]).slice(0,4).map(c=>h('div',{key:c,className:'w-3 h-3 rounded-full border border-neutral-700/60',style:{backgroundColor:c}})),
                    h('span',{className:'ml-auto text-[10px] text-emerald-500'},`${d.spec.sustainability_score||80}/100 eco`)
                  ),
                  h('div',{className:'flex items-center justify-between pt-2 border-t border-neutral-800/40'},
                    h('button',{onClick:()=>setSaved(Store.toggleTrack(d.id)),
                      className:cx('flex items-center gap-1 text-[10px] font-medium',d.isTracking?'text-emerald-400':'text-neutral-600 hover:text-neutral-400')},
                      h(Icon,{name:d.isTracking?'BellRing':'Bell',size:11}),' ',d.isTracking?'Tracking':'Track'),
                    h('div',{className:'flex gap-2.5 items-center'},
                      h('button',{onClick:()=>generate(d.prompt),className:'text-neutral-600 hover:text-violet-400',title:'Remix',style:{transition:'color .15s'}},h(Icon,{name:'RefreshCw',size:12})),
                      h('button',{onClick:()=>{Store.del(d.id);setSaved(Store.get());},className:'text-neutral-700 hover:text-red-400',title:'Delete',style:{transition:'color .15s'}},h(Icon,{name:'Trash2',size:12}))
                    )
                  )
                )
              ))
            )
      )
    ),

    /* ── FOOTER ── */
    h('footer',{className:'border-t border-neutral-900/80 mt-16 py-8'},
      h('div',{className:'max-w-7xl mx-auto px-5 flex flex-col sm:flex-row items-center justify-between gap-3'},
        h('div',{className:'flex items-center gap-2.5'},
          h('div',{className:'bg-white text-black p-1.5 rounded-lg'},h(Icon,{name:'Scissors',size:13})),
          h('span',{className:'text-sm font-semibold text-neutral-300'},'AI Fashion Studio')
        ),
        h('div',{className:'text-center'},
          h('p',{className:'text-xs text-neutral-600'},
            'Designed & built by ',
            h('span',{className:'text-violet-400 font-semibold'},'Piyush Ramteke'),
            ' · IBM Internship 2026'
          ),
          h('p',{className:'text-[10px] text-neutral-800 mt-0.5'},'Powered by Cloudflare Workers AI')
        ),
        h('div',{className:'flex items-center gap-1.5'},
          h('span',{className:'text-[10px] text-neutral-700 bg-neutral-900 border border-neutral-800 px-2 py-1 rounded-md'},'v2.0.0'),
          h('span',{className:'text-[10px] font-medium text-violet-400 bg-violet-400/10 border border-violet-400/20 px-2 py-1 rounded-md'},'BETA')
        )
      )
    )
  );
}

/* ── Mount ────────────────────────────────────────────────────────────── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
setTimeout(hideSplash, 80);
</script>
</body>
</html>
