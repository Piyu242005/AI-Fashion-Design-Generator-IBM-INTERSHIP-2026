/* ── Lucide icon (pure JS, no JSX) ───────────────────────────────────── */
function Icon({ name, size=16, className='' }) {
  if (!window.lucide) return h('span',{style:{display:'inline-block',width:size,height:size}});
  const key = name.charAt(0).toUpperCase()+name.slice(1);
  const def = window.lucide[key]||window.lucide['HelpCircle'];
  if (!def||!Array.isArray(def)) return h('span',{style:{display:'inline-block',width:size,height:size}});
  const children = (def[2]||[]).map(([tag,attrs],i)=>{
    const fixed={};
    for(const [k,v] of Object.entries(attrs||{}))
      fixed[k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=v;
    if(['path','circle','line','rect','polyline','polygon','ellipse'].includes(tag))
      return h(tag,{key:i,...fixed});
    return null;
  });
  return h('svg',{
    xmlns:'http://www.w3.org/2000/svg',width:size,height:size,
    viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',
    strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',
    className:`inline-block shrink-0 ${className}`,
    style:{verticalAlign:'middle'}
  },...children);
}

/* ── PROMPT OPTIMIZER ─────────────────────────────────────────────────── */
// Rewrites any user prompt into a clean FLUX-friendly fashion image prompt.
// Works without Gemini — pure keyword extraction + template injection.
const PromptOptimizer = {
  // Strip photography/camera/lighting jargon that confuses FLUX
  _stripJargon(p) {
    return p
      .replace(/\b(85mm|50mm|35mm|portrait lens|shallow depth of field|bokeh|DSLR|cinematic|photorealistic|4K|ultra-detailed|color grading|natural lighting|golden[- ]hour|warm light|soft light|high detail|realistic skin texture|detailed fabric texture|premium|professional photography|wedding photography|affectionate pose|natural pose|graceful|sophisticated)\b/gi,'')
      .replace(/,\s*,/g,',').replace(/\s+/g,' ').trim();
  },
  // Extract the core fashion subject (what + who + colors)
  _extract(p) {
    const lower = p.toLowerCase();
    // Detect garments
    const garments = ['saree','lehenga','kurta','sherwani','blazer','jacket','dress','suit','co-ord','anarkali','sharara','dupatta'];
    const found = garments.filter(g=>lower.includes(g));
    // Detect colors
    const colors = ['red','blue','green','yellow','orange','pink','purple','white','black','gold','silver','beige','ivory','maroon','navy','teal','emerald','crimson','deep red','royal blue'];
    const foundColors = colors.filter(c=>lower.includes(c));
    // Detect subject (person/couple)
    const isCouple = lower.includes('couple') || lower.includes('two people') || lower.includes('man and woman');
    const isWoman = lower.includes('woman') || lower.includes('girl') || lower.includes('bride') || lower.includes('she');
    const isMan   = lower.includes('man') || lower.includes('groom') || lower.includes('he') || lower.includes('kurta');
    return { garments:found, colors:foundColors, isCouple, isWoman, isMan };
  },
  optimize(userPrompt) {
    const info = this._extract(userPrompt);
    const clean = this._stripJargon(userPrompt);

    // Build a structured FLUX prompt: subject → garment → style → quality
    const subject = info.isCouple
      ? 'Indian couple'
      : info.isWoman ? 'Indian woman'
      : info.isMan   ? 'Indian man'
      : 'fashion model';

    const garmentDesc = info.garments.length
      ? info.garments.join(' and ')
      : clean.split(',')[0]; // first phrase

    const colorDesc = info.colors.slice(0,2).join(' and ');

    const styleTag = info.garments.some(g=>['saree','lehenga','anarkali','sharara'].includes(g))
      ? 'traditional Indian ethnic wear, intricate embroidery, studio fashion photography'
      : 'contemporary Indian fashion, clean studio background, fashion photography';

    return `${subject} wearing ${colorDesc ? colorDesc+' ' : ''}${garmentDesc}, ${styleTag}, sharp focus, high quality`;
  }
};

/* ── AI SERVICES ──────────────────────────────────────────────────────── */
const FashionService = {
  async spec(prompt) {
    // Always build an optimized image prompt client-side first
    const optimized_image_prompt = PromptOptimizer.optimize(prompt);

    if (!GEMINI_KEY) return this.mock(prompt, optimized_image_prompt);
    try {
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`;
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          contents:[{parts:[{text:`Extract fashion details as JSON from this prompt: "${prompt}". Return ONLY valid JSON matching exactly: {"category":"","fabric":"","colors":["#hex1","#hex2","#hex3"],"sustainability_score":80,"budget":{"maximum":3000},"optimized_image_prompt":""} — fill optimized_image_prompt with a short clean image generation prompt describing only the clothing/outfit, max 30 words, no camera terms.`}]}],
          generationConfig:{responseMimeType:'application/json'}
        })});
      const d=await res.json();
      const txt=d.candidates[0].content.parts[0].text;
      const m=txt.match(/```(?:json)?\n([\s\S]*?)\n```/);
      const parsed=JSON.parse(m?m[1]:txt);
      // Always ensure optimized_image_prompt is set — fallback to local optimizer
      if (!parsed.optimized_image_prompt || parsed.optimized_image_prompt.length < 10)
        parsed.optimized_image_prompt = optimized_image_prompt;
      return parsed;
    } catch { return this.mock(prompt, optimized_image_prompt); }
  },
  mock:(p, optimized)=>({
    category:p.toLowerCase().includes('kurta')?'Kurta':p.toLowerCase().includes('saree')?'Saree':p.toLowerCase().includes('lehenga')?'Lehenga':p.toLowerCase().includes('blazer')?'Blazer':'Outfit',
    fabric:'Silk',
    colors:p.toLowerCase().includes('red')||p.toLowerCase().includes('maroon')?['#8B0000','#C41E3A','#FFD700']:
           p.toLowerCase().includes('blue')?['#0f172a','#1e3a5f','#94a3b8']:
           p.toLowerCase().includes('green')?['#14532d','#166534','#86efac']:
           ['#0f172a','#334155','#94a3b8'],
    sustainability_score:85,
    budget:{maximum:4999},
    optimized_image_prompt: optimized || PromptOptimizer.optimize(p)
  })
};

const ImageService = {
  // Returns { image, reason } so callers know WHY a fallback was used
  async generate(prompt, modelId) {
    try {
      const body = { prompt };
      if (modelId) body.model = modelId;
      const res = await fetch(`${BACKEND_URL}/api/design`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      const d = await res.json().catch(() => ({}));
      // ✅ Real AI image
      if (res.ok && d.success && d.image && d.image.startsWith('data:'))
        return { image: d.image, reason: null };
      // ⚠️ Backend alive but not configured (first deploy, missing .env)
      if (res.status === 503)
        return { image: d?.error?.fallback_url || FALLBACK_IMG, reason: 'not_configured' };
      // ⚠️ Rate limited
      if (res.status === 429)
        return { image: d?.error?.fallback_url || FALLBACK_IMG, reason: 'rate_limited' };
      // ⚠️ Backend returned error with a fallback URL
      if (d?.error?.fallback_url)
        return { image: d.error.fallback_url, reason: 'generation_failed' };
    } catch (e) {
      // Network error — backend is sleeping (Render cold start) or offline
      return { image: FALLBACK_IMG, reason: 'offline' };
    }
    return { image: FALLBACK_IMG, reason: 'generation_failed' };
  }
};

    {name:'Hand-Block Print Dupatta Set', price:1099,platform:'Myntra',   score:82,tag:'Artisan',    cats:[]},
  ],
  async search(spec) {
    await new Promise(r=>setTimeout(r,400));
    const cat = (spec.category||'').trim();
    // Prefer items matching the category, fill remainder randomly
    const matched   = this._pool.filter(p=>p.cats.includes(cat));
    const unmatched = this._pool.filter(p=>!p.cats.includes(cat));
    // Shuffle helpers
    const shuffle = a=>[...a].sort(()=>Math.random()-.5);
    const picks = [...shuffle(matched), ...shuffle(unmatched)].slice(0,3);
    // Inject spec-derived name for first match to feel personalised
    if (picks[0] && cat) picks[0] = {...picks[0], name:`${cat} — ${spec.fabric||'Premium'} Blend`};
    return picks.map(({cats,...rest})=>rest);
  }
};

const TryOnService = {
  // Extract a garment description from a prompt or label string
  _describeGarment(garmentLabel) {
    if (!garmentLabel) return 'the selected outfit';
    const lower = garmentLabel.toLowerCase();
    const garments = ['saree','lehenga','kurta','sherwani','blazer','jacket','dress','suit',
                      'co-ord','anarkali','sharara','dupatta','t-shirt','shirt','jeans','top'];
    const found = garments.filter(g => lower.includes(g));
    return found.length ? found.join(' and ') : garmentLabel.split(',')[0].trim();
  },

  // Build the FLUX prompt that describes the person wearing the garment.
  // This produces a SINGLE realistic AI image — no canvas, no compositing, no splits.
  _buildPrompt(garmentDesc, garmentPrompt) {
    // Use garmentPrompt (the original Studio prompt) if available for richer context
    const desc = garmentPrompt
      ? this._describeGarment(garmentPrompt)
      : garmentDesc;
    return (
      `A fashion model wearing ${desc}, ` +
      `full body portrait, studio white background, ` +
      `sharp focus, high quality fashion photography, ` +
      `single person, no collage, no split screen, no duplicate images`
    );
  },

  async process(personImg, garmentImg, garmentPrompt, modelId) {
    // Call FLUX via the backend — returns a real AI-generated image
    // of a model wearing the garment. No canvas involved.
    const garmentDesc = this._describeGarment(garmentPrompt || '');
    const prompt = this._buildPrompt(garmentDesc, garmentPrompt);
    const { image } = await ImageService.generate(prompt, modelId);
    return image;
  }
};

            : h('div',{className:'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4'},
                saved.map(d=>h('div',{key:d.id,className:'bg-neutral-900/40 border border-neutral-800/50 rounded-2xl overflow-hidden flex flex-col group',style:{transition:'all .3s'}},
                  h('div',{className:'h-52 overflow-hidden bg-neutral-950 relative'},
                    h('img',{src:d.image,className:'w-full h-full object-cover',style:{transition:'transform .5s'}}),
                    h('button',{onClick:()=>setBigImg(d.image),
                      className:'absolute top-2 right-2 bg-black/50 p-1.5 rounded-lg text-white/70 hover:text-white border border-white/10 opacity-0 group-hover:opacity-100',
                      style:{backdropFilter:'blur(4px)',transition:'opacity .2s'}},h(Icon,{name:'Maximize2',size:12}))
                  ),
                  h('div',{className:'p-3.5 flex flex-col gap-2.5 flex-1'},
                    h('p',{className:'text-[11px] text-neutral-400 line-clamp-2 leading-relaxed flex-1'},d.prompt),
                    d.spec && h('div',{className:'flex gap-1 items-center'},
                      (d.spec.colors||[]).slice(0,4).map(c=>h('div',{key:c,className:'w-3 h-3 rounded-full border border-neutral-700/60',style:{backgroundColor:c}})),
                      h('span',{className:'ml-auto text-[10px] text-emerald-500'},`${d.spec.sustainability_score||80}/100 eco`)
                    ),
                    h('div',{className:'flex items-center justify-between pt-2 border-t border-neutral-800/40'},
                      h('button',{onClick:()=>setSaved(Store.toggleTrack(d.id)),
                        className:cx('flex items-center gap-1 text-[10px] font-medium',d.isTracking?'text-emerald-400':'text-neutral-600 hover:text-neutral-400')},
                        h(Icon,{name:d.isTracking?'BellRing':'Bell',size:11}),' ',d.isTracking?'Tracking':'Track'),
                      h('div',{className:'flex gap-2.5 items-center'},
                        h('button',{onClick:()=>generate(d.prompt),className:'text-neutral-600 hover:text-violet-400',title:'Remix',style:{transition:'color .15s'}},h(Icon,{name:'RefreshCw',size:12})),
                        h('button',{onClick:()=>{Store.del(d.id);setSaved(Store.get());},className:'text-neutral-700 hover:text-red-400',title:'Delete',style:{transition:'color .15s'}},h(Icon,{name:'Trash2',size:12}))
                      )
                    )
                  )
                ))
              )
        ),

        /* ── Sample Wardrobe Gallery ── */
        h('div',{className:'space-y-4'},
          h('div',{className:'flex items-center justify-between flex-wrap gap-3'},
            h('div',null,
              h('h2',{className:'text-base font-semibold text-neutral-200 flex items-center gap-2'},
                h(Icon,{name:'Shirt',size:15,className:'text-violet-400'}),' Sample Wardrobe'),
              h('p',{className:'text-xs text-neutral-600 mt-0.5'},'16 curated outfits · click any to try on or remix')
            ),
            /* Filter chips */
            h('div',{className:'flex flex-wrap gap-1.5'},
              ['All','Casual','Streetwear','Chic','Formal','Evening','Smart','Cozy'].map(f=>
                h('button',{key:f,onClick:()=>setSwFilter(f),
                  className:cx('text-[11px] px-2.5 py-1 rounded-lg border font-medium',
                    swFilter===f
                      ? 'bg-violet-500/20 border-violet-500/40 text-violet-300'
                      : 'bg-neutral-900/60 border-neutral-800/50 text-neutral-500 hover:text-neutral-300 hover:border-neutral-700'),
                  style:{transition:'all .15s'}},f)
              )
            )
          ),
          h('div',{className:'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3'},
            SAMPLE_WARDROBE
              .filter(s=>swFilter==='All'||s.tag===swFilter)
              .map(s=>h('div',{key:s.id,className:'group relative bg-neutral-900/40 border border-neutral-800/50 rounded-2xl overflow-hidden flex flex-col',style:{transition:'all .25s'}},
                /* Image */
                h('div',{className:'aspect-[3/4] overflow-hidden bg-neutral-950 relative'},
                  h('img',{
                    src: s.file,
                    alt: s.label,
                    className:'w-full h-full object-cover',
                    style:{transition:'transform .4s'},
                    onError:e=>{e.target.style.display='none';}
                  }),
                  /* Hover overlay with action buttons */
                  h('div',{className:'absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center gap-2 p-2',style:{transition:'opacity .2s'}},
                    h('button',{
                      onClick:()=>{
                        setGarmentUpload(null);
                        // Set as garment in Try-On by loading the file as data URL
                        const img = new Image();
                        img.onload = () => {
                          const c = document.createElement('canvas');
                          c.width=img.width; c.height=img.height;
                          c.getContext('2d').drawImage(img,0,0);
                          try { setGarmentUpload(c.toDataURL('image/jpeg',.92)); }
                          catch { setGarmentUpload(s.file); }
                        };
                        img.onerror = () => setGarmentUpload(s.file);
                        img.src = s.file;
                        setTab('tryon');
                      },
                      className:'w-full bg-white text-black py-1.5 rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1 hover:bg-neutral-100',
                      style:{transition:'all .15s'}
                    }, h(Icon,{name:'User',size:11}),' Try On'),
                    h('button',{
                      onClick:()=>{ generate(s.label); },
                      className:'w-full bg-white/15 text-white border border-white/20 py-1.5 rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1 hover:bg-white/25',
                      style:{transition:'all .15s'}
                    }, h(Icon,{name:'Sparkles',size:11}),' Remix'),
                    h('button',{
                      onClick:()=>setBigImg(s.file),
                      className:'bg-black/40 border border-white/10 text-white/70 p-1.5 rounded-lg',
                    }, h(Icon,{name:'Maximize2',size:11}))
                  ),
                  /* Tag chip */
                  h('div',{className:'absolute top-1.5 left-1.5'},
                    h('span',{className:`text-[9px] font-bold px-1.5 py-0.5 rounded-full border ${SW_TAG_CLS[s.tag]||''}`},s.tag)
                  ),
                  /* Gender badge */
                  h('div',{className:'absolute top-1.5 right-1.5'},
                    h('span',{className:'text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-neutral-900/70 border border-neutral-700/50 text-neutral-400'},
                      s.gender==='M'?'Men':s.gender==='W'?'Women':'Unisex')
                  )
                ),
                /* Label */
                h('div',{className:'px-2.5 py-2'},
                  h('p',{className:'text-[11px] text-neutral-300 font-medium line-clamp-1 leading-snug'},s.label)
                )
              ))
          )
        )
      )
    ),

    /* ── FOOTER ── */
    h('footer',{className:'border-t border-neutral-900/80 mt-16 py-8'},
      h('div',{className:'max-w-7xl mx-auto px-5 flex flex-col sm:flex-row items-center justify-between gap-3'},
        h('div',{className:'flex items-center gap-2.5'},
          h('div',{className:'bg-white text-black p-1.5 rounded-lg'},h(Icon,{name:'Scissors',size:13})),
          h('span',{className:'text-sm font-semibold text-neutral-300'},'AI Fashion Studio')
        ),
        h('div',{className:'text-center'},
          h('p',{className:'text-xs text-neutral-600'},
            'Designed & built by ',
            h('span',{className:'text-violet-400 font-semibold'},'Piyush Ramteke'),
            ' · IBM Internship 2026'
          ),
          h('p',{className:'text-[10px] text-neutral-800 mt-0.5'},'Powered by Cloudflare Workers AI')
        ),
        h('div',{className:'flex items-center gap-1.5'},
          h('span',{className:'text-[10px] text-neutral-700 bg-neutral-900 border border-neutral-800 px-2 py-1 rounded-md'},'v2.0.0'),
          h('span',{className:'text-[10px] font-medium text-violet-400 bg-violet-400/10 border border-violet-400/20 px-2 py-1 rounded-md'},'BETA')
        )
      )
    )
  );
}

/* ── Mount ────────────────────────────────────────────────────────────── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
setTimeout(hideSplash, 80);
</script>
</body>
</html>
